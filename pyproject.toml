[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpal"
version = "0.1.0"
description = "CLI tool for versioned prompt management with encryption"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "cryptography>=41.0",
    "pydantic>=2.0"
]

[project.scripts]
promptpal = "promptpal.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptpal*"]
